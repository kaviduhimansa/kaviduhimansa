<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Kavidu Himansa — Full-stack development</title>
  <desc id="desc">A dark navy developer banner with amber highlights and a terminal showing Kavidu's web and mobile projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d17"/><stop offset=".62" stop-color="#101a2b"/><stop offset="1" stop-color="#141b28"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f59e0b" stop-opacity=".2"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .halo { animation: breathe 4s ease-in-out infinite alternate; transform-origin: 1020px 94px; }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes breathe { from { opacity: .55; transform: scale(.96); } to { opacity: .95; transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .halo { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <ellipse class="halo" cx="1020" cy="94" rx="220" ry="190" fill="url(#glow)"/>
  <path d="M28 76V28Q28 16 40 16H248" fill="none" stroke="url(#amber)" stroke-width="4" stroke-linecap="round" opacity=".95"/>
  <path d="M1158 354V402Q1158 414 1146 414H1000" fill="none" stroke="url(#amber)" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <circle cx="1085" cy="83" r="2" fill="#fbbf24" opacity=".8"/><circle cx="1120" cy="109" r="2" fill="#fbbf24" opacity=".45"/><circle cx="1054" cy="132" r="2" fill="#fb923c" opacity=".6"/>
  <g class="sans" fill="#f8fafc">
    <text x="72" y="105" font-size="15" font-weight="700" letter-spacing="4" fill="#fbbf24">IT UNDERGRADUATE  /  SRI LANKA</text>
    <text x="68" y="177" font-size="58" font-weight="800" letter-spacing="-2">Kavidu Himansa</text>
    <text x="72" y="220" font-size="23" font-weight="600" fill="#e2e8f0">Full-stack web &amp; mobile development</text>
    <text x="72" y="262" font-size="16" fill="#a9b6c8">Building practical apps with Laravel, React, and Flutter.</text>
  </g>
  <g class="sans" font-size="13" font-weight="650">
    <rect x="72" y="300" width="135" height="34" rx="17" fill="#1a2637" stroke="#334155"/><text x="139" y="322" fill="#fbbf24" text-anchor="middle">Laravel · PHP</text>
    <rect x="218" y="300" width="127" height="34" rx="17" fill="#1a2637" stroke="#334155"/><text x="281" y="322" fill="#fdba74" text-anchor="middle">React · JS</text>
    <rect x="356" y="300" width="132" height="34" rx="17" fill="#1a2637" stroke="#334155"/><text x="422" y="322" fill="#fbbf24" text-anchor="middle">Flutter · Dart</text>
  </g>
  <text class="mono" x="72" y="380" font-size="14" fill="#64748b">github.com/<tspan fill="#cbd5e1">kaviduhimansa</tspan></text>
  <g filter="url(#shadow)">
    <rect x="626" y="82" width="500" height="278" rx="16" fill="#0b111c" stroke="#344154" stroke-width="1.5"/>
    <path d="M642 82H1110Q1126 82 1126 98V126H626V98Q626 82 642 82Z" fill="#182234"/>
    <circle cx="651" cy="104" r="5" fill="#fb7185"/><circle cx="670" cy="104" r="5" fill="#fbbf24"/><circle cx="689" cy="104" r="5" fill="#4ade80"/>
    <text class="mono" x="876" y="109" text-anchor="middle" font-size="12" fill="#94a3b8">kavidu@github: ~/projects</text>
  </g>
  <g class="mono" font-size="14">
    <text x="655" y="161" fill="#fbbf24">$</text><text x="675" y="161" fill="#e2e8f0">profile --featured</text>
    <text x="655" y="193" fill="#64748b">01</text><text x="685" y="193" fill="#e2e8f0">bus-tracking-api</text><text x="925" y="193" fill="#fb923c">Laravel / PHP</text>
    <text x="655" y="225" fill="#64748b">02</text><text x="685" y="225" fill="#e2e8f0">whatsapp-dashboard</text><text x="925" y="225" fill="#fb923c">Laravel / PHP</text>
    <text x="655" y="257" fill="#64748b">03</text><text x="685" y="257" fill="#e2e8f0">student-task-manager</text><text x="925" y="257" fill="#fbbf24">Flutter / Dart</text>
    <text x="655" y="289" fill="#64748b">04</text><text x="685" y="289" fill="#e2e8f0">personal-portfolio</text><text x="925" y="289" fill="#fb923c">React / Vite</text>
    <text x="655" y="329" fill="#fbbf24">$</text><text x="675" y="329" fill="#94a3b8">learn · build · improve</text><rect class="cursor" x="859" y="316" width="8" height="18" rx="1" fill="#fbbf24"/>
  </g>
</svg>
